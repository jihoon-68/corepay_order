# 서버
server:
  port: 8082

services:
  product:
    url: localhost:8083
  payment:
    url: localhost:8084

outbox:
  scheduler:
    enabled: true

# 스프링
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
      circuitbreaker:
        enabled: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/migration/common

  kafka:
    bootstrap-servers: localhost:9092 # 카프카 서버 주소
    consumer:
      group-id: ${spring.application.name}-group # 각 서버의 고유 그룹 이름
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
      retries: 3
    properties:
      spring:
        json:
          trusted:
            packages: "*"
          use:
            type:
              headers: false

  data:
    redis:
      host: localhost
      port: 6379


  threads:
    virtual:
      enabled: true
  logging:
    level:
      org.hibernate.orm.jdbc.bind: TRACE

# 서킷 브래이크
resilience4j:
  circuitbreaker:
    instances:
      productclient:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state:
          seconds: 10
        permitted-number-of-calls-in-half-open-state: 2
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics,threaddump, heapdump # 프로메테우스가 접근할 수 있도록 엔드포인트 개방
  metrics:
    tags:
      application: ${spring.application.name} # 그라파나 대시보드에서 서버 필터링할 때 사용
